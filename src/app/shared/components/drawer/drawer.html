<nz-drawer
  [nzVisible]="sharedService.visible()"
  [nzTitle]="sharedService.title()"
  [nzPlacement]="sharedService.placement()"
  (nzOnClose)="sharedService.close()">

  <ng-container *nzDrawerContent>

    <ng-container
      *ngComponentOutlet="sharedService.component()">
    </ng-container>

  </ng-container>

</nz-drawer>
